<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Disha Sonkar — Generative AI Engineer</title>
<desc id="desc">Animated midnight aurora banner with radiant teal, violet and blue light trails.</desc>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050816"/><stop offset=".52" stop-color="#10152e"/><stop offset="1" stop-color="#071c2c"/>
  </linearGradient>
  <radialGradient id="glowA"><stop stop-color="#4DEEEA" stop-opacity=".72"/><stop offset="1" stop-color="#4DEEEA" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop stop-color="#9B5CFF" stop-opacity=".68"/><stop offset="1" stop-color="#9B5CFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC"><stop stop-color="#2D9CDB" stop-opacity=".58"/><stop offset="1" stop-color="#2D9CDB" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4DEEEA" stop-opacity="0"/><stop offset=".48" stop-color="#9B5CFF" stop-opacity=".9"/><stop offset="1" stop-color="#4DEEEA" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#B9D8FF" stroke-opacity=".07" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="520" rx="28" fill="url(#base)"/>
<rect width="1600" height="520" rx="28" fill="url(#grid)"/>
<g filter="url(#blur)" opacity=".95">
  <ellipse cx="280" cy="170" rx="360" ry="210" fill="url(#glowA)">
    <animate attributeName="cx" values="280;560;280" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="170;330;170" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1120" cy="120" rx="390" ry="230" fill="url(#glowB)">
    <animate attributeName="cx" values="1120;870;1120" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;300;120" dur="15s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="820" cy="500" rx="420" ry="150" fill="url(#glowC)">
    <animate attributeName="cx" values="820;1250;820" dur="22s" repeatCount="indefinite"/>
  </ellipse>
</g>
<g fill="none" stroke="url(#line)" stroke-width="2" opacity=".72">
  <path d="M-40 360 C260 120 420 510 760 270 S1280 80 1640 300"><animate attributeName="d" dur="14s" repeatCount="indefinite" values="M-40 360 C260 120 420 510 760 270 S1280 80 1640 300;M-40 280 C260 480 420 100 760 340 S1280 430 1640 180;M-40 360 C260 120 420 510 760 270 S1280 80 1640 300"/></path>
  <path d="M-20 420 C300 230 450 420 780 220 S1300 180 1620 360" opacity=".5"><animate attributeName="d" dur="18s" repeatCount="indefinite" values="M-20 420 C300 230 450 420 780 220 S1300 180 1620 360;M-20 320 C300 100 450 500 780 310 S1300 80 1620 260;M-20 420 C300 230 450 420 780 220 S1300 180 1620 360"/></path>
</g>
<g fill="#DDFBFF">
  <circle cx="180" cy="92" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="430" cy="410" r="2"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="1320" cy="85" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="1450" cy="370" r="2"><animate attributeName="opacity" values="1;.15;1" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="980" cy="440" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
<rect x="72" y="68" width="1456" height="384" rx="24" fill="none" stroke="#C7E9FF" stroke-opacity=".2"/>
<g text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="800" y="218" fill="#F7FBFF" font-size="68" font-weight="700" letter-spacing="2">DISHA SONKAR</text>
  <text x="800" y="274" fill="#B8C7E8" font-size="25" font-weight="500" letter-spacing="5">GENERATIVE AI ENGINEER</text>
  <text x="800" y="332" fill="#7FE8E2" font-size="18" letter-spacing="2">RAG  ·  AGENTIC AI  ·  LANGGRAPH  ·  PYTHON  ·  LLM APPLICATIONS</text>
  <path d="M570 365H1030" stroke="#8D7CFF" stroke-width="2" stroke-linecap="round" opacity=".85">
    <animate attributeName="opacity" values=".35;1;.35" dur="3.5s" repeatCount="indefinite"/>
  </path>
</g>
</svg>