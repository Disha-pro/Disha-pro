<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Disha Sonkar — Generative AI Engineer</title>
<desc id="desc">Animated premium serum-inspired palette with warm ivory, berry, terracotta, blush and coral gradients.</desc>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF9F4"/><stop offset=".48" stop-color="#FBE9E6"/><stop offset="1" stop-color="#F7D8D5"/>
  </linearGradient>
  <radialGradient id="berry"><stop stop-color="#8E315D" stop-opacity=".34"/><stop offset="1" stop-color="#8E315D" stop-opacity="0"/></radialGradient>
  <radialGradient id="coral"><stop stop-color="#F27C72" stop-opacity=".52"/><stop offset="1" stop-color="#F27C72" stop-opacity="0"/></radialGradient>
  <radialGradient id="blush"><stop stop-color="#EBA6B2" stop-opacity=".58"/><stop offset="1" stop-color="#EBA6B2" stop-opacity="0"/></radialGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8E315D" stop-opacity="0"/><stop offset=".5" stop-color="#C65D4B" stop-opacity=".72"/><stop offset="1" stop-color="#8E315D" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="48"/></filter>
  <pattern id="grain" width="42" height="42" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8E315D" opacity=".09"/></pattern>
</defs>
<rect width="1600" height="520" rx="30" fill="url(#base)"/>
<rect width="1600" height="520" rx="30" fill="url(#grain)"/>
<g filter="url(#blur)">
  <ellipse cx="240" cy="170" rx="360" ry="230" fill="url(#coral)">
    <animate attributeName="cx" values="240;520;240" dur="17s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="170;330;170" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1190" cy="140" rx="390" ry="240" fill="url(#blush)">
    <animate attributeName="cx" values="1190;900;1190" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="140;300;140" dur="16s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="790" cy="500" rx="440" ry="170" fill="url(#berry)">
    <animate attributeName="cx" values="790;1250;790" dur="21s" repeatCount="indefinite"/>
  </ellipse>
</g>
<g fill="none" stroke="url(#ribbon)" stroke-width="2.4" opacity=".82">
  <path d="M-40 355 C260 100 450 510 790 260 S1290 80 1640 300">
    <animate attributeName="d" dur="16s" repeatCount="indefinite" values="M-40 355 C260 100 450 510 790 260 S1290 80 1640 300;M-40 270 C260 470 450 90 790 350 S1290 420 1640 180;M-40 355 C260 100 450 510 790 260 S1290 80 1640 300"/>
  </path>
  <path d="M-20 420 C300 220 480 440 800 220 S1300 170 1620 360" opacity=".55">
    <animate attributeName="d" dur="19s" repeatCount="indefinite" values="M-20 420 C300 220 480 440 800 220 S1300 170 1620 360;M-20 320 C300 90 480 500 800 310 S1300 70 1620 260;M-20 420 C300 220 480 440 800 220 S1300 170 1620 360"/>
  </path>
</g>
<g fill="#8E315D">
  <circle cx="180" cy="92" r="2.2"><animate attributeName="opacity" values=".18;1;.18" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="430" cy="410" r="2"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="1320" cy="85" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="1450" cy="370" r="2"><animate attributeName="opacity" values="1;.15;1" dur="4.4s" repeatCount="indefinite"/></circle>
</g>
<rect x="72" y="68" width="1456" height="384" rx="25" fill="none" stroke="#8E315D" stroke-opacity=".22" stroke-width="1.5"/>
<g text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="800" y="218" fill="#54213F" font-size="70" font-weight="750" letter-spacing="2">DISHA SONKAR</text>
  <text x="800" y="274" fill="#8E315D" font-size="25" font-weight="600" letter-spacing="5">GENERATIVE AI ENGINEER</text>
  <text x="800" y="332" fill="#B65B54" font-size="18" font-weight="600" letter-spacing="2">RAG  ·  AGENTIC AI  ·  LANGGRAPH  ·  PYTHON  ·  LLM APPLICATIONS</text>
  <path d="M570 365H1030" stroke="#C65D4B" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="opacity" values=".3;1;.3" dur="3.2s" repeatCount="indefinite"/>
  </path>
</g>
</svg>